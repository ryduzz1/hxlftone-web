<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Join hxlftone, a Discord community for manga animation editors sharing edits, resources, feedback, packs, and After Effects workflows.">
    <meta name="keywords" content="hxlftone, manga animation, manga edits, manga editors, anime edits, manga editing discord, After Effects manga edits, AMV editors">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#f5f5f7">
    <link rel="canonical" href="https://hxlftone.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="hxlftone">
    <meta property="og:url" content="https://hxlftone.com/">
    <meta property="og:title" content="hxlftone | Manga Animation Editors">
    <meta property="og:description" content="A Discord community for manga editors, by manga editors.">
    <meta property="og:image" content="https://hxlftone.com/assets/og-hxlftone.png">
    <meta property="og:image:alt" content="hxlftone - for manga editors, by manga editors">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="hxlftone | Manga Animation Editors">
    <meta name="twitter:description" content="A Discord community for manga editors, by manga editors.">
    <meta name="twitter:image" content="https://hxlftone.com/assets/og-hxlftone.png">
    <title>hxlftone | Manga Animation Discord Community</title>
    <link rel="icon" href="assets/hxlftone-icon.png">
    <link rel="apple-touch-icon" href="assets/hxlftone-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "hxlftone",
        "url": "https://hxlftone.com/",
        "description": "A Discord community for manga animation editors.",
        "sameAs": ["https://discord.com/invite/hkyh8JWs78"]
      }
    </script>
  </head>
  <body>
    <main id="top">
      <section class="hero" aria-labelledby="hero-title">
        <div class="manga-anchor" aria-hidden="true">
          <img
            src="assets/manga-editor.png"
            alt=""
            width="1008"
            height="939"
          >
          <span class="blink-eye blink-eye-left"></span>
          <span class="blink-eye blink-eye-right"></span>
        </div>

        <div class="hero-copy">
          <h1 id="hero-title">hxlftone</h1>
          <p class="hero-text">built for manga editors</p>
          <a class="primary-button" href="https://discord.com/invite/hkyh8JWs78" aria-label="Join the hxlftone Discord community">
            discord.gg/hxlftone
          </a>
        </div>
      </section>
    </main>
    <script>
      const hero = document.querySelector(".hero");

      if (hero && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        const setMotion = (event) => {
          const rect = hero.getBoundingClientRect();
          const x = ((event.clientX - rect.left) / rect.width - 0.5).toFixed(3);
          const y = ((event.clientY - rect.top) / rect.height - 0.5).toFixed(3);
          document.documentElement.style.setProperty("--mx", x);
          document.documentElement.style.setProperty("--my", y);
          hero.style.setProperty("--mx", x);
          hero.style.setProperty("--my", y);
        };

        hero.addEventListener("pointermove", setMotion);
        let blinkTimer;
        let isPointerDown = false;

        const blink = () => {
          if (hero.classList.contains("is-pressing")) return;
          hero.classList.add("is-blinking");
          window.setTimeout(() => hero.classList.remove("is-blinking"), 145);
        };

        const scheduleBlink = () => {
          window.clearTimeout(blinkTimer);
          blinkTimer = window.setTimeout(() => {
            blink();
            scheduleBlink();
          }, 2400 + Math.random() * 4200);
        };

        hero.addEventListener("pointerdown", (event) => {
          isPointerDown = true;
          hero.classList.add("is-pressing");
          window.clearTimeout(blinkTimer);
          if (event.pointerId && hero.setPointerCapture) {
            hero.setPointerCapture(event.pointerId);
          }
        });

        const releasePress = () => {
          if (!isPointerDown) return;
          isPointerDown = false;
          hero.classList.remove("is-pressing");
          scheduleBlink();
        };

        hero.addEventListener("pointerup", releasePress);
        hero.addEventListener("pointercancel", releasePress);
        window.addEventListener("pointerup", releasePress);
        hero.addEventListener("pointerleave", () => {
          if (!isPointerDown) {
            hero.classList.remove("is-pressing");
            scheduleBlink();
          }
          document.documentElement.style.setProperty("--mx", 0);
          document.documentElement.style.setProperty("--my", 0);
          hero.style.setProperty("--mx", 0);
          hero.style.setProperty("--my", 0);
        });

        scheduleBlink();
      }
    </script>
  </body>
</html>
